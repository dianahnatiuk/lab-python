<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedLab{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1d2733; }
    header { background: #0b5ed7; color: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    header form { margin: 0; }
    main { max-width: 900px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    .card + .card { margin-top: 16px; }
    table button { margin: 0; padding: 4px 10px; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; background: #0b5ed7; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    header button { margin: 0; background: #fff; color: #0b5ed7; }
    .error { background: #fdecea; color: #b3261e; padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid #e3e7eb; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <strong>MedLab</strong>
    {% if user %}
    <form method="post" action="/logout">
      <span>{{ user.full_name }} ({{ user.role }})</span>
      <button type="submit">Вийти</button>
    </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
