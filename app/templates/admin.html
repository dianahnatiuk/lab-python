{% extends "base.html" %}
{% block title %}Адмін-панель{% endblock %}
{% block content %}
<div class="card">
  <h2>Адмін-панель</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <h3>Створити працівника</h3>
  <form method="post" action="/admin/users">
    <label>ПІБ <input type="text" name="full_name" required minlength="2"></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Пароль <input type="password" name="password" required minlength="8"></label>
    <label>Роль
      <select name="role">
        {% for r in roles %}<option value="{{ r.value }}">{{ r.value }}</option>{% endfor %}
      </select>
    </label>
    <button type="submit">Створити</button>
  </form>
  <h3>Користувачі</h3>
  <table>
    <tr><th>ID</th><th>ПІБ</th><th>Email</th><th>Роль</th></tr>
    {% for u in users %}
    <tr><td>{{ u.id }}</td><td>{{ u.full_name }}</td><td>{{ u.email }}</td><td>{{ u.role }}</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
