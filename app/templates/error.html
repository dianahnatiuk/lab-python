{% extends "base.html" %}
{% block title %}Помилка {{ code }} &middot; MedLab{% endblock %}
{% block content %}
<div class="card error-page">
  <div class="error-code">{{ code }}</div>
  <h1>Помилка {{ code }}</h1>
  <p class="muted">{{ message }}</p>
  {% if error_id %}
  <p>Код помилки для служби підтримки: <strong>{{ error_id }}</strong></p>
  {% endif %}
  <p><a class="btn btn-primary" href="/">На головну</a></p>
</div>
{% endblock %}
