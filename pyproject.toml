[project]
name = "medlab-aggregator"
version = "0.1.0"
description = "Агрегатор результатів медичних аналізів"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Depends() у аргументах — штатний патерн FastAPI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
