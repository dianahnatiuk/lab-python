# Запуск кожного середовища окремо (різні файли змінних і різні проєкти Compose):
#   docker compose --env-file .env.sandbox    -p medlab-sandbox    up -d --build
#   docker compose --env-file .env.production -p medlab-production up -d --build
# Прапорець -p дає окремі контейнери, мережі й томи, тому дані середовищ не змішуються.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT is not set}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER is not set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is not set}
    ports:
      - "127.0.0.1:${MONGO_PORT:?MONGO_PORT is not set}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?ENV_FILE is not set}
    environment:
      # Усередині Docker-мережі база й Mongo доступні за іменами сервісів
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
    ports:
      - "${API_PORT:?API_PORT is not set}:8000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
